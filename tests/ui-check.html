<!doctype html>
<meta charset="utf-8">
<title>pending</title>
<body style="margin:0">
<div id="root"></div>
<script type="module">
import { mountEditor } from '../dist/editor.js';
const results = [];
const t = (name, ok, detail = '') => results.push({ name, ok, detail });

const editor = mountEditor(document.getElementById('root'),
	{ base: '../dist/' });
try {
	const bytes = new Uint8Array(await (await fetch('./hostile-model.dng')).arrayBuffer());
	// A subarray on purpose: the editor must send the view, not its backing
	// buffer, or the frame arrives with neighbouring bytes glued to it.
	const padded = new Uint8Array(bytes.length + 64);
	padded.set(bytes, 32);
	await editor.open(padded.subarray(32, 32 + bytes.length), 'hostile-model.dng');

	await new Promise((r) => setTimeout(r, 300));

	t('no script ran from the file', window.__pwned === undefined,
		'window.__pwned = ' + String(window.__pwned));
	const chip = document.querySelector('.re-chip');
	t('the model is shown as text', !!chip && chip.textContent.includes('<img src=x'),
		chip ? JSON.stringify(chip.textContent) : 'no chip');
	t('no element was created from it', !document.querySelector('#root img'));
	t('the module loaded its own stylesheet',
		!!document.querySelector('link[data-raw-editor]'));
	t('the styles actually applied',
		getComputedStyle(document.getElementById('root')).position === 'fixed');
	t('a subarray opened correctly',
		!!document.querySelector('.re-stage canvas:not([hidden])'));
} catch (e) {
	t('the editor opened the frame', false, e.message);
}

/* Capture and Download live in the editor's own chrome now, so the host page
 * does not need a page of its own around it. Both halves matter: the button
 * must not appear when there is nothing behind it, and it must actually work
 * when there is. */
try {
	t('no Capture button without a capture provider',
		!document.querySelector('#root .re-top [data-act="capture"]'));
	const save = document.querySelector('#root .re-top [data-act="save"]');
	t('Download is offered once a frame is open', !!save && !save.disabled);
} catch (e) {
	t('the chrome reflects what the host provides', false, e.message);
}

try {
	const host = document.createElement('div');
	document.body.append(host);
	let asked = 0;
	const withCapture = mountEditor(host, {
		base: '../dist/',
		styles: false,
		capture: async () => {
			asked++;
			const b = new Uint8Array(await (await fetch('./fixture.dng')).arrayBuffer());
			return { bytes: b, name: 'captured.dng' };
		},
	});
	const cap = host.querySelector('.re-top [data-act="capture"]');
	const save = host.querySelector('.re-top [data-act="save"]');
	t('a capture provider grows a Capture button', !!cap);
	t('Download is refused until there is something to save', !!save && save.disabled);
	t('the empty state offers the capture too',
		!!host.querySelector('.re-drop [data-act="capture"]'));

	cap.click();
	// The click is synchronous; the frame it asks for is not.
	for (let i = 0; i < 60 && !host.querySelector('.re-stage canvas:not([hidden])'); i++)
		await new Promise((r) => setTimeout(r, 100));

	t('pressing it asks the host exactly once', asked === 1, 'asked ' + asked);
	t('and the captured frame is developed',
		!!host.querySelector('.re-stage canvas:not([hidden])'));
	t('which is then downloadable', !!save && !save.disabled);
	const name = host.querySelector('.re-top span');
	t('named by what the host called it',
		!!name && /captured\.dng/.test(host.querySelector('.re-top').textContent));
	withCapture.destroy();
	host.remove();
} catch (e) {
	t('the capture path works end to end', false, e.message);
}

/* The neutral picker, clicked the way a person clicks it: arm it from the
 * panel, click the picture, and the white balance must move to what was under
 * the pointer. */
try {
	const pick = document.querySelector('#root [data-act="pick-neutral"]');
	t('the white balance panel offers a picker', !!pick);
	const stage = document.querySelector('#root .re-stage');
	const before = Array.from(document.querySelectorAll('#root .re-rnum')).map((n) => n.textContent);

	pick.click();
	t('arming it puts the stage in picking mode', stage.classList.contains('re-pick'));

	const box = document.querySelector('#root .re-stage canvas').getBoundingClientRect();
	stage.dispatchEvent(new MouseEvent('click', {
		bubbles: true,
		clientX: Math.round(box.left + box.width / 2),
		clientY: Math.round(box.top + box.height / 2),
	}));
	for (let i = 0; i < 40 && stage.classList.contains('re-pick'); i++)
		await new Promise((r) => setTimeout(r, 50));
	t('clicking disarms it again', !stage.classList.contains('re-pick'));

	await new Promise((r) => setTimeout(r, 600));
	const after = Array.from(document.querySelectorAll('#root .re-rnum')).map((n) => n.textContent);
	t('and the white balance moved to what was clicked',
		JSON.stringify(before) !== JSON.stringify(after),
		before.join(',') + ' -> ' + after.join(','));
	t('the panel says what it was set from',
		/Set from the picture/.test(document.querySelector('#root .re-insp').textContent));

	/* The click above landed on the exact centre of the canvas. The engine can
	 * be asked the same question independently, and the two answers must agree
	 * -- which is what catches a mapping off by a scale factor or an offset,
	 * where "the sliders moved" would not.
	 *
	 * That comparison rests on the canvas centre being the image centre, which
	 * is only exactly true when the preview is unstepped: a stepped canvas is
	 * floor(width / step) wide, so its midpoint maps back to a coordinate up to
	 * half a step away. So the premise is asserted rather than assumed. It is
	 * deliberately NOT fixed by sharing the picker's own arithmetic -- a test
	 * that computes the expected answer the way the code does would agree with
	 * the code however wrong both were. */
	const { instantiate } = await import('../dist/engine.js');
	const probe = await instantiate(await (await fetch('../dist/engine.wasm')).arrayBuffer());
	const pinfo = probe.open(new Uint8Array(await (await fetch('./hostile-model.dng')).arrayBuffer()));
	const shownCanvas = document.querySelector('#root .re-stage canvas');
	t('this frame previews unstepped, so the centres really are the same point',
		shownCanvas.width === pinfo.width && shownCanvas.height === pinfo.height,
		`canvas ${shownCanvas.width}x${shownCanvas.height} vs frame ${pinfo.width}x${pinfo.height}`);
	const want = probe.samplePatch(Math.round(pinfo.width / 2), Math.round(pinfo.height / 2), 6);
	const shown = Array.from(document.querySelectorAll('#root .re-rnum'))
		.map((n) => parseFloat(n.textContent));
	// Red and Blue are the third and fourth readouts: Black, White, Red, Blue,
	// Exposure.
	const gotRed = shown[2], gotBlue = shown[3];
	t('the click mapped to the centre of the frame, not near it',
		Math.abs(gotRed - want.neutral[0]) < 0.02 && Math.abs(gotBlue - want.neutral[2]) < 0.02,
		`ui ${gotRed} / ${gotBlue}  vs engine ${want.neutral[0].toFixed(3)} / ${want.neutral[2].toFixed(3)}`);
} catch (e) {
	t('the neutral picker works', false, e.message);
}

/* Calibrate: the corners, the solve, and the way back. The way back is the
 * part that matters -- a matrix written to a camera persists, so the default
 * has to be that it comes off again. */
try {
	const host = document.createElement('div');
	document.body.append(host);
	const calls = [];
	const ed = mountEditor(host, {
		base: '../dist/',
		styles: false,
		calibrate: {
			holdSeconds: 5,
			apply: async (m) => { calls.push(['apply', m]); },
			revert: async () => { calls.push(['revert']); },
		},
	});
	await ed.open(new Uint8Array(await (await fetch('./fixture.dng')).arrayBuffer()), 'fixture.dng');

	const modes = [...host.querySelectorAll('.re-seg button')];
	const calBtn = modes.find((b) => b.textContent === 'Calibrate');
	t('Calibrate is a mode now, not a stub', !!calBtn && !calBtn.disabled);

	calBtn.click();
	await new Promise((r) => setTimeout(r, 300));
	t('it puts a chart on the picture', !host.querySelector('.re-chart').hidden);
	t('with four corners to drag', host.querySelectorAll('.re-chart-grip').length === 4);
	t('and a dot per patch', host.querySelectorAll('.re-chart-cell').length === 24,
		String(host.querySelectorAll('.re-chart-cell').length));

	/* The corners have to actually drag. The first version rebuilt every grip
	 * on each pointermove, which destroyed the node holding the pointer
	 * capture: the corner jumped to the first move and then stopped following.
	 * Two moves is what separates "it moved" from "it is being dragged". */
	{
		const grip = host.querySelector('.re-chart-grip[data-corner="0"]');
		const before = grip.style.left;
		const r = grip.getBoundingClientRect();
		grip.dispatchEvent(new PointerEvent('pointerdown',
			{ bubbles: true, pointerId: 7, clientX: r.left + 9, clientY: r.top + 9 }));
		const stage = host.querySelector('.re-stage').getBoundingClientRect();
		const p1 = { clientX: stage.left + stage.width * 0.30, clientY: stage.top + stage.height * 0.30 };
		const p2 = { clientX: stage.left + stage.width * 0.42, clientY: stage.top + stage.height * 0.44 };
		window.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 7, ...p1 }));
		const after1 = grip.style.left;
		window.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 7, ...p2 }));
		const after2 = grip.style.left;
		window.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 7, ...p2 }));

		t('a corner follows the first move', after1 !== before, `${before} -> ${after1}`);
		t('and keeps following the second, rather than stopping',
			after2 !== after1, `${after1} -> ${after2}`);
		t('the same node is still the grip, not a replacement',
			host.querySelector('.re-chart-grip[data-corner="0"]') === grip);
		t('and it stops when the pointer goes up', (() => {
			const held = grip.style.left;
			window.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 7,
				clientX: stage.left + stage.width * 0.6, clientY: stage.top + stage.height * 0.6 }));
			return grip.style.left === held;
		})());
		host.querySelector('.re-btn').parentElement
			&& [...host.querySelectorAll('.re-btn')].find((b) => b.textContent === 'Reset corners')?.click();
	}

	host.querySelector('[data-act="measure"]').click();
	for (let i = 0; i < 100 && !host.querySelector('[data-act="apply-to-camera"]'); i++)
		await new Promise((r) => setTimeout(r, 100));
	const send = host.querySelector('[data-act="apply-to-camera"]');
	t('measuring solves and offers to write it', !!send);

	send.click();
	for (let i = 0; i < 40 && !host.querySelector('[data-act="hold"]'); i++)
		await new Promise((r) => setTimeout(r, 100));
	t('applying asks the host exactly once',
		calls.length === 1 && calls[0][0] === 'apply', JSON.stringify(calls.map((c) => c[0])));
	t('and what it sends is two matrices and a white balance',
		!!calls[0][1] && calls[0][1].ccm.length === 9 &&
		calls[0][1].colorMatrix.length === 9 && calls[0][1].neutral.length === 3);
	t('the countdown says it will be put back',
		/putting it back in \d+s/i.test(host.querySelector('[data-act="hold"]').textContent),
		host.querySelector('[data-act="hold"]')?.textContent.slice(0, 80));

	// Left alone, it must revert. That is the whole safety property.
	await new Promise((r) => setTimeout(r, 6500));
	t('and left alone, it really does put it back',
		calls.length === 2 && calls[1][0] === 'revert', JSON.stringify(calls.map((c) => c[0])));

	// Confirming must stop the clock rather than merely hide it.
	// Waiting on the button rather than on the call count: the count rises when
	// apply() resolves, and the buttons are appended after that.
	const untilKeep = async () => {
		for (let i = 0; i < 60; i++) {
			const k = host.querySelector('[data-act="keep"]');
			if (k) return k;
			await new Promise((r) => setTimeout(r, 100));
		}
		return null;
	};
	send.click();
	(await untilKeep()).click();
	await new Promise((r) => setTimeout(r, 6500));
	t('confirming stops the clock for good',
		calls.length === 3 && calls[2][0] === 'apply', JSON.stringify(calls.map((c) => c[0])));

	// And closing the editor must not leave a timer that reverts a camera
	// whose operator has gone.
	send.click();
	await untilKeep();
	ed.destroy();
	await new Promise((r) => setTimeout(r, 6500));
	t('closing the editor cancels the countdown rather than firing it',
		calls.length === 4, JSON.stringify(calls.map((c) => c[0])));
	host.remove();
} catch (e) {
	t('calibrate works end to end', false, e.message);
}

/* A module that never arrives must fail fast and say so, not leave the caller
 * waiting for ever on a worker that will never answer. */
try {
	const broken = mountEditor(document.createElement('div'),
		{ base: '../no-such-directory/', styles: false });
	const began = performance.now();
	let message = '';
	try { await broken.open(new Uint8Array(8), 'x.dng'); }
	catch (e) { message = e.message; }
	const took = performance.now() - began;
	t('a missing module fails rather than hangs', /http 404/.test(message), message || '(resolved!)');
	t('and fails promptly', took < 10000, Math.round(took) + ' ms');
	broken.destroy();
} catch (e) {
	t('the missing-module path is handled', false, e.message);
}

/* Closing mid-flight must settle whatever was in the air. */
try {
	const closing = mountEditor(document.createElement('div'), { base: '../dist/', styles: false });
	const inFlight = closing.open(new Uint8Array(
		await (await fetch('./fixture.dng')).arrayBuffer()), 'fixture.dng');
	closing.destroy();
	let message = '';
	try { await inFlight; } catch (e) { message = e.message; }
	t('closing the editor settles requests in flight', /closed/.test(message),
		message || '(never settled)');
} catch (e) {
	t('the teardown path is handled', false, e.message);
}
// Reported over HTTP rather than through the title: the harness then runs on
// a real clock. A virtual-time budget fires every timer as fast as it can,
// which loses the race against the module's own fetches every time.
await fetch('/__results', { method: 'POST', body: JSON.stringify(results) });
document.title = 'done';
</script>
