<!doctype html>
<meta charset="utf-8">
<title>pending</title>
<body style="margin:0">
<div id="root"></div>
<script type="module">
import { mountEditor } from '../dist/editor.js';
const results = [];
const t = (name, ok, detail = '') => results.push({ name, ok, detail });

const editor = mountEditor(document.getElementById('root'),
	{ base: '../dist/' });
try {
	const bytes = new Uint8Array(await (await fetch('./hostile-model.dng')).arrayBuffer());
	// A subarray on purpose: the editor must send the view, not its backing
	// buffer, or the frame arrives with neighbouring bytes glued to it.
	const padded = new Uint8Array(bytes.length + 64);
	padded.set(bytes, 32);
	await editor.open(padded.subarray(32, 32 + bytes.length), 'hostile-model.dng');

	await new Promise((r) => setTimeout(r, 300));

	t('no script ran from the file', window.__pwned === undefined,
		'window.__pwned = ' + String(window.__pwned));
	const chip = document.querySelector('.re-chip');
	t('the model is shown as text', !!chip && chip.textContent.includes('<img src=x'),
		chip ? JSON.stringify(chip.textContent) : 'no chip');
	t('no element was created from it', !document.querySelector('#root img'));
	t('the module loaded its own stylesheet',
		!!document.querySelector('link[data-raw-editor]'));
	t('the styles actually applied',
		getComputedStyle(document.getElementById('root')).position === 'fixed');
	t('a subarray opened correctly',
		!!document.querySelector('.re-stage canvas:not([hidden])'));
} catch (e) {
	t('the editor opened the frame', false, e.message);
}

/* Plates: the tab exists only when the host gives it somewhere to read from,
 * which is the same rule the Capture button follows. Both halves matter — the
 * tab must not appear with nothing behind it, and it must appear and build its
 * panel when there is. No reader is stubbed here on purpose: the point is the
 * contract between host and editor, and a panel that offers to look is the
 * whole of what this option promises before anything is fetched. */
try {
	const bare = document.createElement('div');
	document.body.append(bare);
	mountEditor(bare, { base: '../dist/', styles: false, autoCapture: false });
	const tabNames = (el) => [...el.querySelectorAll('.re-seg button')].map((b) => b.textContent.trim());
	t('no Plates tab without a plates provider', !tabNames(bare).includes('Plates'),
		tabNames(bare).join('|'));
	t('and Diagnose does not offer to read one either', (() => {
		const d = [...bare.querySelectorAll('.re-seg button')].find((b) => b.textContent.trim() === 'Diagnose');
		if (!d) return false;
		d.click();
		return !/Reading a plate here/i.test(bare.querySelector('.re-insp').textContent);
	})());

	const host = document.createElement('div');
	document.body.append(host);
	mountEditor(host, {
		base: '../dist/', styles: false, autoCapture: false,
		plates: {
			readerSupported: false,
			reader: () => Promise.reject(new Error('no module in a test')),
			burst: () => Promise.reject(new Error('no camera in a test')),
			exposure: {
				holdSeconds: 30,
				plan: () => null, supports: () => Promise.resolve({}),
				apply: () => Promise.resolve(), revert: () => Promise.resolve(),
				keep: () => Promise.resolve(), armed: () => false,
			},
		},
	});
	t('a plates provider grows a Plates tab', tabNames(host).includes('Plates'),
		tabNames(host).join('|'));
	const plates = [...host.querySelectorAll('.re-seg button')].find((b) => b.textContent.trim() === 'Plates');
	plates.click();
	const insp = host.querySelector('.re-insp');
	t('and the tab builds a panel that offers to look',
		!!insp.querySelector('[data-act="find-plates"]'));
	t('which says nothing has been found yet rather than nothing at all',
		/Candidates are listed best read first/i.test(insp.textContent));
	const diag = [...host.querySelectorAll('.re-seg button')].find((b) => b.textContent.trim() === 'Diagnose');
	diag.click();
	t('Diagnose gains the plate card when a provider is there',
		/Reading a plate here/i.test(host.querySelector('.re-insp').textContent));
	t('and asks for a plate to be picked before it measures one',
		/Pick a plate on the Plates tab/i.test(host.querySelector('.re-insp').textContent));
} catch (e) {
	t('the Plates tab follows the host', false, e.message);
}

/* Capture and Download live in the editor's own chrome now, so the host page
 * does not need a page of its own around it. Both halves matter: the button
 * must not appear when there is nothing behind it, and it must actually work
 * when there is. */
try {
	t('no Capture button without a capture provider',
		!document.querySelector('#root .re-top [data-act="capture"]'));
	const save = document.querySelector('#root .re-top [data-act="save"]');
	t('Download is offered once a frame is open', !!save && !save.disabled);
} catch (e) {
	t('the chrome reflects what the host provides', false, e.message);
}

try {
	const host = document.createElement('div');
	document.body.append(host);
	let asked = 0;
	const withCapture = mountEditor(host, {
		base: '../dist/',
		styles: false,
		// Off, so the button below is what asks. The automatic path is checked
		// on its own further down.
		autoCapture: false,
		capture: async () => {
			asked++;
			const b = new Uint8Array(await (await fetch('./fixture.dng')).arrayBuffer());
			return { bytes: b, name: 'captured.dng' };
		},
	});
	const cap = host.querySelector('.re-top [data-act="capture"]');
	const save = host.querySelector('.re-top [data-act="save"]');
	t('a capture provider grows a Capture button', !!cap);
	t('Download is refused until there is something to save', !!save && save.disabled);
	t('the empty state offers the capture too',
		!!host.querySelector('.re-drop [data-act="capture"]'));

	cap.click();
	// The click is synchronous; the frame it asks for is not.
	for (let i = 0; i < 60 && !host.querySelector('.re-stage canvas:not([hidden])'); i++)
		await new Promise((r) => setTimeout(r, 100));

	t('pressing it asks the host exactly once', asked === 1, 'asked ' + asked);
	t('and the captured frame is developed',
		!!host.querySelector('.re-stage canvas:not([hidden])'));
	t('which is then downloadable', !!save && !save.disabled);
	const name = host.querySelector('.re-top span');
	t('named by what the host called it',
		!!name && /captured\.dng/.test(host.querySelector('.re-top').textContent));
	withCapture.destroy();
	host.remove();
} catch (e) {
	t('the capture path works end to end', false, e.message);
}

/* A frame arrives without being asked for, and the wait is visible.
 *
 * The first version put an empty stage and a Capture button in front of an
 * operator who had just navigated to the raw page -- a question that answers
 * itself. */
try {
	const host = document.createElement('div');
	document.body.append(host);
	let asked = 0, release = null;
	const held = new Promise((r) => { release = r; });
	const ed = mountEditor(host, {
		base: '../dist/',
		styles: false,
		capture: async () => {
			asked++;
			await held;               /* so the waiting state can be looked at */
			const b = new Uint8Array(await (await fetch('./fixture.dng')).arrayBuffer());
			return { bytes: b, name: 'auto.dng' };
		},
	});
	for (let i = 0; i < 60 && asked === 0; i++) await new Promise((r) => setTimeout(r, 50));
	t('a capture provider is asked for a frame without being told', asked === 1,
		'asked ' + asked);
	// While it is in flight there must be something that reads as "wait",
	// and NOT a button implying nothing has started.
	t('and the wait says so, with a spinner', !!host.querySelector('.re-drop .re-spinner'));
	t('rather than offering a button for what is already happening',
		!host.querySelector('.re-drop [data-act="capture"]'));
	// One wait, one label. The corner chip is for a re-capture over a frame
	// that is already on screen.
	t('and it is said once, not twice', host.querySelector('.re-busy')?.hidden !== false,
		'corner chip also showing');
	release();
	for (let i = 0; i < 80 && !host.querySelector('.re-stage canvas:not([hidden])'); i++)
		await new Promise((r) => setTimeout(r, 100));
	t('and the frame it fetched is developed',
		!!host.querySelector('.re-stage canvas:not([hidden])'));
	t('asked exactly once, not once per render', asked === 1, 'asked ' + asked);
	ed.destroy();
	host.remove();
} catch (e) {
	t('the automatic first capture works', false, e.message);
}

/* A host that opens a frame itself must not have one dropped on top of it. */
try {
	const host = document.createElement('div');
	document.body.append(host);
	let asked = 0;
	const ed = mountEditor(host, {
		base: '../dist/',
		styles: false,
		capture: async () => {
			asked++;
			const b = new Uint8Array(await (await fetch('./fixture.dng')).arrayBuffer());
			return { bytes: b, name: 'auto.dng' };
		},
	});
	await ed.open(new Uint8Array(await (await fetch('./hostile-model.dng')).arrayBuffer()),
		'hostile-model.dng');
	await new Promise((r) => setTimeout(r, 600));
	/* The automatic capture starts at mount, before a host has had the chance
	 * to open anything, so it may well have been asked -- that is the price of
	 * overlapping the transfer with the module load, and autoCapture:false is
	 * how a host that minds declines it. What must hold is that the frame it
	 * fetched does not land on top of the one the host asked for. */
	t('and the frame on screen is the one the host opened',
		/hostile-model\.dng/.test(host.querySelector('.re-top').textContent),
		host.querySelector('.re-top')?.textContent.slice(0, 60));
	t('not the one the automatic capture was fetching',
		!/auto\.dng/.test(host.querySelector('.re-top').textContent),
		host.querySelector('.re-top')?.textContent.slice(0, 60));
	// And it settles rather than leaving the stage stuck behind a spinner.
	// The drop zone being HIDDEN is the test: its spinner is still in the DOM
	// underneath the canvas, which is why looking for the element found it.
	t('which leaves nothing still saying it is capturing',
		host.querySelector('.re-drop')?.hidden === true &&
		host.querySelector('.re-busy')?.hidden !== false,
		`drop ${host.querySelector('.re-drop')?.hidden}, chip ${host.querySelector('.re-busy')?.hidden}`);
	ed.destroy();
	host.remove();
} catch (e) {
	t('the host still wins over the automatic capture', false, e.message);
}

/* Nothing is shown before it can be shown properly.
 *
 * .re-root is position:fixed;inset:0, so without its stylesheet the chrome is
 * not merely unstyled -- it lays out as page flow, browser-default buttons
 * stacked down over the host page. That is what an operator saw for the
 * second or two the CDN took. */
try {
	const host = document.createElement('div');
	document.body.append(host);
	// styles:true is the point here, and the sheet is a real fetch.
	const ed = mountEditor(host, { base: '../dist/' });
	// Synchronously after mounting -- the worst moment, before anything has
	// had a chance to arrive.
	t('the chrome is not painted before its stylesheet',
		host.style.visibility === 'hidden', `visibility ${host.style.visibility || '(unset)'}`);
	t('but something is, so the page is not simply blank',
		!!host.querySelector('[data-act="splash"] .re-spinner'));
	t('and it carries its own styling, needing no stylesheet to look right',
		(host.querySelector('[data-act="splash"]')?.style.position) === 'fixed');

	for (let i = 0; i < 100 && host.style.visibility === 'hidden'; i++)
		await new Promise((r) => setTimeout(r, 50));
	t('once the stylesheet lands the interface is revealed',
		host.style.visibility !== 'hidden', `visibility ${host.style.visibility || '(unset)'}`);
	t('and the splash is gone rather than left over the picture',
		!host.querySelector('[data-act="splash"]'));
	t('the stylesheet really did arrive',
		!!document.querySelector('link[data-raw-editor]'));

	ed.destroy();
	t('destroying before or after, the host is not left invisible',
		host.style.visibility !== 'hidden');
	host.remove();
} catch (e) {
	t('the editor does not paint itself unstyled', false, e.message);
}

/* A capture that goes wrong must hand the stage back.
 *
 * All three of these left "Capturing a frame..." on screen with no way out,
 * or were believed to and were not -- the rejection path was already right,
 * which is why they are all checked rather than the one that looked broken. */
try {
	const fixture = async () => new Uint8Array(
		await (await fetch('./fixture.dng')).arrayBuffer());
	const probe = async (label, capture, opts, after, settle) => {
		const host = document.createElement('div');
		document.body.append(host);
		const ed = mountEditor(host, { base: '../dist/', styles: false, capture, ...opts });
		await new Promise((r) => setTimeout(r, 600));
		if (after) await after(ed);
		await new Promise((r) => setTimeout(r, settle || 2500));
		const r = {
			spinning: !!host.querySelector('.re-drop .re-spinner'),
			error: /could not|failed|has not sent/i.test(host.textContent),
			button: !!host.querySelector('.re-drop [data-act="capture"]'),
			frame: !!host.querySelector('.re-stage canvas:not([hidden])'),
			name: host.querySelector('.re-top')?.textContent || '',
			said: (host.querySelector('.re-drop')?.textContent || '').replace(/\s+/g, ' '),
		};
		ed.destroy(); host.remove();
		return r;
	};

	const rejected = await probe('rejects', async () => { throw new Error('Failed to fetch'); });
	t('a capture that fails says so rather than spinning',
		!rejected.spinning && rejected.error && rejected.button, JSON.stringify(rejected));

	// A fetch that stalls cannot be cancelled -- the host hands over a promise
	// and nothing else -- so the wait is bounded and the stage handed back.
	const stalled = await probe('stalls', () => new Promise(() => {}), { captureTimeoutMs: 1200 });
	t('a capture that never answers gives the stage back anyway',
		!stalled.spinning && stalled.error && stalled.button, JSON.stringify(stalled));
	// Against what the panel actually rendered. Asserting a literal against
	// itself, which the first version of this did, passes whatever the code says.
	t('and says so in seconds, with the number agreeing with the wait',
		/has not sent a frame in 1 second\./i.test(stalled.said),
		stalled.said.slice(0, 90) || '(said nothing)');

	/*
	 * The one that was actually broken. An automatic capture standing down for
	 * a frame the host opened returned early, leaving the spinner and
	 * "Capturing a frame..." sitting on top of a picture that had loaded.
	 */
	const stoodDown = await probe('stands down',
		() => new Promise((r) => setTimeout(async () => r({ bytes: await fixture(), name: 'late.dng' }), 900)),
		{}, async (ed) => { await ed.open(await fixture(), 'host.dng'); });
	t('an automatic capture standing down clears the stage it claimed',
		!stoodDown.spinning && stoodDown.frame, JSON.stringify(stoodDown));
	t('and leaves the host’s frame on screen, not its own',
		/host\.dng/.test(stoodDown.name) && !/late\.dng/.test(stoodDown.name), stoodDown.name.slice(0, 40));

	// Giving up waiting is not the same as throwing the frame away.
	const late = await probe('late',
		() => new Promise((r) => setTimeout(async () => r({ bytes: await fixture(), name: 'late.dng' }), 1800)),
		{ captureTimeoutMs: 700 }, null, 3500);
	t('a frame that arrives after the wait was given up is still used',
		late.frame && /late\.dng/.test(late.name), JSON.stringify(late));
} catch (e) {
	t('a failed capture hands the stage back', false, e.message);
}

/* The neutral picker, clicked the way a person clicks it: arm it from the
 * panel, click the picture, and the white balance must move to what was under
 * the pointer. */
try {
	const pick = document.querySelector('#root [data-act="pick-neutral"]');
	t('the white balance panel offers a picker', !!pick);
	const stage = document.querySelector('#root .re-stage');
	const before = Array.from(document.querySelectorAll('#root .re-rnum')).map((n) => n.textContent);

	pick.click();
	t('arming it puts the stage in picking mode', stage.classList.contains('re-pick'));

	const box = document.querySelector('#root .re-stage canvas').getBoundingClientRect();
	stage.dispatchEvent(new MouseEvent('click', {
		bubbles: true,
		clientX: Math.round(box.left + box.width / 2),
		clientY: Math.round(box.top + box.height / 2),
	}));
	for (let i = 0; i < 40 && stage.classList.contains('re-pick'); i++)
		await new Promise((r) => setTimeout(r, 50));
	t('clicking disarms it again', !stage.classList.contains('re-pick'));

	await new Promise((r) => setTimeout(r, 600));
	const after = Array.from(document.querySelectorAll('#root .re-rnum')).map((n) => n.textContent);
	t('and the white balance moved to what was clicked',
		JSON.stringify(before) !== JSON.stringify(after),
		before.join(',') + ' -> ' + after.join(','));
	t('the panel says what it was set from',
		/Set from the picture/.test(document.querySelector('#root .re-insp').textContent));

	/* The click above landed on the exact centre of the canvas. The engine can
	 * be asked the same question independently, and the two answers must agree
	 * -- which is what catches a mapping off by a scale factor or an offset,
	 * where "the sliders moved" would not.
	 *
	 * That comparison rests on the canvas centre being the image centre, which
	 * is only exactly true when the preview is unstepped: a stepped canvas is
	 * floor(width / step) wide, so its midpoint maps back to a coordinate up to
	 * half a step away. So the premise is asserted rather than assumed. It is
	 * deliberately NOT fixed by sharing the picker's own arithmetic -- a test
	 * that computes the expected answer the way the code does would agree with
	 * the code however wrong both were. */
	const { instantiate } = await import('../dist/engine.js');
	const probe = await instantiate(await (await fetch('../dist/engine.wasm')).arrayBuffer());
	const pinfo = probe.open(new Uint8Array(await (await fetch('./hostile-model.dng')).arrayBuffer()));
	const shownCanvas = document.querySelector('#root .re-stage canvas');
	t('this frame previews unstepped, so the centres really are the same point',
		shownCanvas.width === pinfo.width && shownCanvas.height === pinfo.height,
		`canvas ${shownCanvas.width}x${shownCanvas.height} vs frame ${pinfo.width}x${pinfo.height}`);
	const want = probe.samplePatch(Math.round(pinfo.width / 2), Math.round(pinfo.height / 2), 6);
	const shown = Array.from(document.querySelectorAll('#root .re-rnum'))
		.map((n) => parseFloat(n.textContent));
	// Red and Blue are the third and fourth readouts: Black, White, Red, Blue,
	// Exposure.
	const gotRed = shown[2], gotBlue = shown[3];
	t('the click mapped to the centre of the frame, not near it',
		Math.abs(gotRed - want.neutral[0]) < 0.02 && Math.abs(gotBlue - want.neutral[2]) < 0.02,
		`ui ${gotRed} / ${gotBlue}  vs engine ${want.neutral[0].toFixed(3)} / ${want.neutral[2].toFixed(3)}`);
} catch (e) {
	t('the neutral picker works', false, e.message);
}

/* Calibrate: the corners, the solve, and the way back. The way back is the
 * part that matters -- a matrix written to a camera persists, so the default
 * has to be that it comes off again. */
try {
	const host = document.createElement('div');
	document.body.append(host);
	const calls = [];
	const ed = mountEditor(host, {
		base: '../dist/',
		styles: false,
		calibrate: {
			holdSeconds: 5,
			apply: async (m) => { calls.push(['apply', m]); },
			revert: async () => { calls.push(['revert']); },
			keep: async () => { calls.push(['keep']); },
			// The camera's own colour calibration, as a Hi3516EV300 + IMX335
			// exported it.
			baseline: async () => [
				'[static_awb]', 'AutoStaticWb = "483, 256, 256, 465"',
				'AutoCurvePara = "-18, 267, -7, 160031, 128, -107969"',
				'[static_ccm]', 'TotalNum = "3"', 'AutoColorTemp = "4900, 3850, 2650"',
				'AutoCCMTable_0 = "452, 32952, 32780, 32845, 356, 32791, 32769, 32965, 454"',
				'AutoCCMTable_1 = "448, 32939, 32789, 32833, 356, 32803, 32769, 32986, 475"',
				'AutoCCMTable_2 = "408, 32890, 32798, 32854, 381, 32807, 32769, 33112, 600"',
			].join('\n'),
			persist: async (ini) => { calls.push(['persist', ini]); },
		},
	});
	await ed.open(new Uint8Array(await (await fetch('./fixture.dng')).arrayBuffer()), 'fixture.dng');

	const modes = [...host.querySelectorAll('.re-seg button')];
	const calBtn = modes.find((b) => b.textContent === 'Calibrate');
	t('Calibrate is a mode now, not a stub', !!calBtn && !calBtn.disabled);

	calBtn.click();
	await new Promise((r) => setTimeout(r, 300));
	t('it puts a chart on the picture', !host.querySelector('.re-chart').hidden);
	t('with four corners to drag', host.querySelectorAll('.re-chart-grip').length === 4);
	t('and a dot per patch', host.querySelectorAll('.re-chart-cell').length === 24,
		String(host.querySelectorAll('.re-chart-cell').length));

	/* The corners have to actually drag. The first version rebuilt every grip
	 * on each pointermove, which destroyed the node holding the pointer
	 * capture: the corner jumped to the first move and then stopped following.
	 * Two moves is what separates "it moved" from "it is being dragged". */
	{
		const grip = host.querySelector('.re-chart-grip[data-corner="0"]');
		const before = grip.style.left;
		const r = grip.getBoundingClientRect();
		grip.dispatchEvent(new PointerEvent('pointerdown',
			{ bubbles: true, pointerId: 7, clientX: r.left + 9, clientY: r.top + 9 }));
		const stage = host.querySelector('.re-stage').getBoundingClientRect();
		const p1 = { clientX: stage.left + stage.width * 0.30, clientY: stage.top + stage.height * 0.30 };
		const p2 = { clientX: stage.left + stage.width * 0.42, clientY: stage.top + stage.height * 0.44 };
		window.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 7, ...p1 }));
		const after1 = grip.style.left;
		window.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 7, ...p2 }));
		const after2 = grip.style.left;
		window.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 7, ...p2 }));

		t('a corner follows the first move', after1 !== before, `${before} -> ${after1}`);
		t('and keeps following the second, rather than stopping',
			after2 !== after1, `${after1} -> ${after2}`);
		t('the same node is still the grip, not a replacement',
			host.querySelector('.re-chart-grip[data-corner="0"]') === grip);
		/* Two fingers, two corners. Window listeners hear every pointer, so a
		 * gesture that does not check which one it is will have one finger
		 * dragging both corners and the first lift ending both. */
		{
			const g0 = host.querySelector('.re-chart-grip[data-corner="0"]');
			const g1 = host.querySelector('.re-chart-grip[data-corner="1"]');
			const r0 = g0.getBoundingClientRect(), r1 = g1.getBoundingClientRect();
			g0.dispatchEvent(new PointerEvent('pointerdown',
				{ bubbles: true, pointerId: 11, clientX: r0.left + 9, clientY: r0.top + 9 }));
			g1.dispatchEvent(new PointerEvent('pointerdown',
				{ bubbles: true, pointerId: 12, clientX: r1.left + 9, clientY: r1.top + 9 }));
			const was1 = g1.style.left;
			const st = host.querySelector('.re-stage').getBoundingClientRect();
			window.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 11,
				clientX: st.left + st.width * 0.2, clientY: st.top + st.height * 0.2 }));
			t('one finger moves only its own corner', g1.style.left === was1,
				`the other corner went ${was1} -> ${g1.style.left}`);
			window.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 11,
				clientX: st.left + st.width * 0.2, clientY: st.top + st.height * 0.2 }));
			const held1 = g1.style.left;
			window.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 12,
				clientX: st.left + st.width * 0.8, clientY: st.top + st.height * 0.5 }));
			t('and lifting it does not end the other drag', g1.style.left !== held1,
				`${held1} -> ${g1.style.left}`);
			window.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 12,
				clientX: st.left + st.width * 0.8, clientY: st.top + st.height * 0.5 }));
		}

		t('and it stops when the pointer goes up', (() => {
			const held = grip.style.left;
			window.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 7,
				clientX: stage.left + stage.width * 0.6, clientY: stage.top + stage.height * 0.6 }));
			return grip.style.left === held;
		})());
		host.querySelector('.re-btn').parentElement
			&& [...host.querySelectorAll('.re-btn')].find((b) => b.textContent === 'Reset corners')?.click();
	}

	/* A new frame must take the old frame's chart with it. Leaving the corners
	 * where the previous picture put them is worse than useless: they look
	 * placed, and they are measuring the wrong thing. */
	{
		// Both fixtures are 256x256, so the DEFAULT corners land in the same
		// place for either. Dragging one away first is what makes "reset" and
		// "left alone" tell apart at all.
		const grip = host.querySelector('.re-chart-grip[data-corner="0"]');
		const atDefault = grip.style.left;
		// Aimed at the MIDDLE of the canvas. The element is as wide as the stage
		// while a square frame is letterboxed inside it by object-fit, so a
		// point at 15% of the element is still in that margin -- outside the
		// frame, where frameCoords rightly refuses it and nothing moves.
		const cv = host.querySelector('.re-stage canvas').getBoundingClientRect();
		const gr = grip.getBoundingClientRect();
		const to = { clientX: cv.left + cv.width * 0.55, clientY: cv.top + cv.height * 0.25 };
		grip.dispatchEvent(new PointerEvent('pointerdown',
			{ bubbles: true, pointerId: 21, clientX: gr.left + 9, clientY: gr.top + 9 }));
		window.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 21, ...to }));
		window.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 21, ...to }));
		const dragged = grip.style.left;
		t('the corner really did move off its default first', dragged !== atDefault,
			`default ${atDefault}, after drag ${dragged}`);

		await ed.open(new Uint8Array(await (await fetch('./hostile-model.dng')).arrayBuffer()),
			'hostile-model.dng');
		await new Promise((r) => setTimeout(r, 400));
		t('opening a frame in Calibrate keeps Calibrate', !host.querySelector('.re-chart').hidden &&
			!!host.querySelector('[data-act="measure"]'));
		t('and the corners go back to the default rather than staying where the old frame left them',
			host.querySelector('.re-chart-grip[data-corner="0"]').style.left === atDefault,
			`dragged to ${dragged}, now ${host.querySelector('.re-chart-grip[data-corner="0"]').style.left}, default ${atDefault}`);
		t('with the previous result cleared rather than left to be applied',
			!host.querySelector('[data-act="apply-to-camera"]'));
		// Back to the frame the rest of this block measures.
		await ed.open(new Uint8Array(await (await fetch('./fixture.dng')).arrayBuffer()), 'fixture.dng');
		await new Promise((r) => setTimeout(r, 400));
	}

	host.querySelector('[data-act="measure"]').click();
	for (let i = 0; i < 100 && !host.querySelector('[data-act="apply-to-camera"]'); i++)
		await new Promise((r) => setTimeout(r, 100));
	const send = host.querySelector('[data-act="apply-to-camera"]');
	t('measuring solves and offers to write it', !!send);
	{
		// What the fit is scored in, said in the unit it was minimised in.
		const txt = host.querySelector('.re-note')?.parentElement?.textContent || '';
		const res = [...host.querySelectorAll('p.re-note')].map((p) => p.textContent).join(' | ');
		t('the result reports ΔE2000', /Mean ΔE2000 \d+\.\d\d, worst \d+\.\d\d/.test(res), res.slice(0, 160) || txt.slice(0, 80));
		// fixture.dng is off a real camera and carries its ColorMatrix1/2, so
		// the light can be named.
		const light = host.querySelector('[data-role="light"]');
		t('and names the light off the camera\'s own matrices',
			!!light && /about \d{4,5} K/.test(light.textContent), light?.textContent || '(no light line)');
	}

	send.click();
	for (let i = 0; i < 40 && !host.querySelector('[data-act="hold"]'); i++)
		await new Promise((r) => setTimeout(r, 100));
	t('applying asks the host exactly once',
		calls.length === 1 && calls[0][0] === 'apply', JSON.stringify(calls.map((c) => c[0])));
	t('and what it sends is two matrices and a white balance',
		!!calls[0][1] && calls[0][1].ccm.length === 9 &&
		calls[0][1].colorMatrix.length === 9 && calls[0][1].neutral.length === 3);
	t('the countdown says it will be put back',
		/putting it back in \d+s/i.test(host.querySelector('[data-act="hold"]').textContent),
		host.querySelector('[data-act="hold"]')?.textContent.slice(0, 80));

	// Left alone, it must revert. That is the whole safety property.
	await new Promise((r) => setTimeout(r, 6500));
	t('and left alone, it really does put it back',
		calls.length === 2 && calls[1][0] === 'revert', JSON.stringify(calls.map((c) => c[0])));

	// Confirming must stop the clock rather than merely hide it.
	// Waiting on the button rather than on the call count: the count rises when
	// apply() resolves, and the buttons are appended after that.
	const untilKeep = async () => {
		for (let i = 0; i < 60; i++) {
			const k = host.querySelector('[data-act="keep"]');
			if (k) return k;
			await new Promise((r) => setTimeout(r, 100));
		}
		return null;
	};
	send.click();
	(await untilKeep()).click();
	await new Promise((r) => setTimeout(r, 6500));
	t('confirming stops the clock for good',
		calls.filter((c) => c[0] === 'revert').length === 1,
		JSON.stringify(calls.map((c) => c[0])));
	// The host has to be TOLD it was confirmed, or anything it armed to undo
	// the change -- a timer, an unload handler -- takes it back later anyway.
	t('and the host is told it was confirmed, so it can stand down',
		calls.some((c) => c[0] === 'keep'), JSON.stringify(calls.map((c) => c[0])));

	// A light kept, a profile built from it against the camera's own, and the
	// profile saved -- through the same countdown, because a bad white balance
	// curve makes a picture as unwatchable as a bad matrix does.
	{
		const until = async (sel) => {
			for (let i = 0; i < 60; i++) {
				const n = host.querySelector(sel);
				if (n) return n;
				await new Promise((r) => setTimeout(r, 100));
			}
			return null;
		};
		host.querySelector('[data-act="record"]').click();
		t('keeping a light lists it', host.querySelectorAll('[data-role="kept-light"]').length === 1,
			String(host.querySelectorAll('[data-role="kept-light"]').length));
		(await until('[data-act="build-profile"]')).click();
		const ini = await until('[data-role="profile-ini"]');
		t('building writes the colour sections the camera reads',
			!!ini && /\[static_awb\]/.test(ini.textContent) && /AutoCurvePara/.test(ini.textContent) &&
			/TotalNum\s+= "\d"/.test(ini.textContent), ini ? ini.textContent.slice(0, 120) : '(none)');
		const cmp = host.querySelector('[data-role="profile-compare"]');
		t('and says, per light, what the camera does now against what this would',
			!!cmp && /→/.test(cmp.textContent), cmp ? cmp.textContent.slice(0, 120) : '(none)');
		const before = calls.length;
		host.querySelector('[data-act="persist-profile"]').click();
		const k = await until('[data-act="hold"] [data-act="keep"]');
		t('saving hands the host exactly that text',
			calls.length === before + 1 && calls[before][0] === 'persist' &&
			calls[before][1] === ini.textContent, JSON.stringify(calls.slice(before).map((c) => c[0])));
		// A second save under a running countdown would be put back by the
		// first one's timer: revert() answers for whatever was written last.
		host.querySelector('[data-act="persist-profile"]').click();
		await new Promise((r) => setTimeout(r, 200));
		t('a second save is refused while the first is still waiting',
			calls.length === before + 1, JSON.stringify(calls.slice(before).map((c) => c[0])));
		k.click();
		for (let i = 0; i < 20 && calls[calls.length - 1][0] !== 'keep'; i++)
			await new Promise((r) => setTimeout(r, 100));
		t('and confirming it tells the host', calls[calls.length - 1][0] === 'keep',
			JSON.stringify(calls.slice(before).map((c) => c[0])));
	}

	// And closing the editor must not leave a timer that reverts a camera
	// whose operator has gone.
	// Leaving Calibrate with a change still waiting ends it the way the clock
	// would have: put back. Nobody can confirm what they can no longer see,
	// and silently dropping the countdown left the host never told either way.
	send.click();
	await untilKeep();
	const revertsBefore = calls.filter((c) => c[0] === 'revert').length;
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Develop').click();
	for (let i = 0; i < 20 && calls.filter((c) => c[0] === 'revert').length === revertsBefore; i++)
		await new Promise((r) => setTimeout(r, 100));
	t('leaving Calibrate mid-countdown puts the change back',
		calls.filter((c) => c[0] === 'revert').length === revertsBefore + 1,
		JSON.stringify(calls.map((c) => c[0])));
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Calibrate').click();
	await new Promise((r) => setTimeout(r, 300));
	host.querySelector('[data-act="measure"]').click();
	const send2 = await (async () => {
		for (let i = 0; i < 100; i++) {
			const b = host.querySelector('[data-act="apply-to-camera"]');
			if (b) return b;
			await new Promise((r) => setTimeout(r, 100));
		}
		return null;
	})();

	// And closing the editor must not leave a timer that reverts a camera
	// whose operator has gone.
	send2.click();
	await untilKeep();
	const revertsAtClose = calls.filter((c) => c[0] === 'revert').length;
	ed.destroy();
	await new Promise((r) => setTimeout(r, 6500));
	// Counting calls would break every time the contract gains one; what this
	// means is that destroy() added no revert of its own.
	t('closing the editor cancels the countdown rather than firing it',
		calls.filter((c) => c[0] === 'revert').length === revertsAtClose &&
		calls[calls.length - 1][0] === 'apply',
		JSON.stringify(calls.map((c) => c[0])));
	host.remove();
} catch (e) {
	t('calibrate works end to end', false, e.message);
}

/* The defect scan says how much to trust itself.
 *
 * A bare count was the original output and it was badly misleading: on a
 * furnished room the scan reported 291 pixels of which four survived a change
 * of scene, and Sony ships sensors as good with up to 800 white pixels in the
 * dark. The count alone cannot carry that, so the panel now shows the
 * distribution and the arrangement beside it. */
try {
	const host = document.createElement('div');
	document.body.append(host);
	const ed = mountEditor(host, { base: '../dist/', styles: false, autoCapture: false });
	const scan = async () => {
		host.querySelector('[data-act="scan"]').click();
		for (let i = 0; i < 120 && !host.querySelector('.re-devplot'); i++)
			await new Promise((r) => setTimeout(r, 100));
		await new Promise((r) => setTimeout(r, 200));
	};

	// Clumped defects: the arrangement of scene detail, not of silicon.
	await ed.open(new Uint8Array(await (await fetch('/__defects.dng?mode=clustered&n=120')).arrayBuffer()),
		'clustered.dng');
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Diagnose').click();
	await new Promise((r) => setTimeout(r, 250));
	await scan();

	t('the scan draws the deviation histogram', !!host.querySelector('.re-devplot'));
	t('with bars in it, not an empty frame',
		host.querySelectorAll('.re-devplot rect').length > 5,
		String(host.querySelectorAll('.re-devplot rect').length));
	t('and the Gaussian that noise alone would give',
		!!host.querySelector('.re-devplot polyline'));
	t('a clumped set is called out as following the picture',
		/not scattered the way sensor defects are/i.test(host.textContent),
		host.querySelector('.re-notice')?.textContent.slice(0, 70) || '(said nothing)');

	// Scattered defects: what silicon looks like. The warning must go away,
	// or it is decoration rather than a verdict.
	await ed.open(new Uint8Array(await (await fetch('/__defects.dng?mode=scattered&n=120')).arrayBuffer()),
		'scattered.dng');
	await new Promise((r) => setTimeout(r, 250));
	await scan();
	t('a scattered set is not', !/not scattered the way sensor defects are/i.test(host.textContent));

	// The brightness gate has to be offered, and has to change the answer.
	{
		const before = host.querySelector('[data-act="scan"]');
		t('the scan offers to look only where the picture is dark',
			[...host.querySelectorAll('.re-seg button')].some((b) => b.textContent === 'Darkest'));
		// "None." carries no digit, and on this fixture the darkest quarter
		// legitimately finds none: the field is uniformly flat, so the only
		// thing raising a site's local background is its own spike, and the
		// defects gate themselves out. A real frame's background is scene
		// content, against which one pixel in forty-nine is nothing.
		const countOf = () => {
			// No \b before None: textContent runs the "Defects" heading straight
			// into it, so there is no word boundary to match on.
			if (/None\. No pixel disagrees/.test(host.textContent)) return 0;
			const m = host.textContent.match(/(\d+) pixels? disagree/);
			return m ? Number(m[1]) : undefined;
		};
		const wide = countOf();
		[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Darkest').click();
		await new Promise((r) => setTimeout(r, 250));
		t('choosing it throws away the reading taken somewhere else',
			!host.querySelector('.re-devplot'), 'the old histogram is still on screen');
		await scan();
		t('and the new reading says where it looked',
			/only where the picture is dark/i.test(host.textContent));
		const narrow = countOf();
		t('finding no more than the whole frame did',
			wide !== undefined && narrow !== undefined && narrow <= wide,
			`${wide} everywhere, ${narrow} in the darkest quarter | panel says: ` +
			`${wide} everywhere, ${narrow} in the darkest quarter`);
		[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Everywhere').click();
		await new Promise((r) => setTimeout(r, 250));
		await scan();
	}

	/* Accumulating captures and believing a site seen in N of them.
	 *
	 * A strict intersection drops random-telegraph pixels, which switch
	 * between levels and need not clear the threshold every time -- and those
	 * are largely the same population as the hot pixels. So the rule is N of
	 * M, and the tally across all M is shown because where the numbers fall is
	 * the answer. */
	{
		// From here every capture carries the same 12 planted sensor defects
		// plus 60 of its own, so the tally has a real population to find.
		await ed.open(new Uint8Array(await (await fetch('/__defects.dng?mode=scattered&n=60&shared=12&seed=55')).arrayBuffer()),
			'first-view.dng');
		await new Promise((r) => setTimeout(r, 250));
		await scan();
		const keep = host.querySelector('[data-act="hold-scan"]');
		t('a scan can be kept for comparison', !!keep);
		keep.click();
		await new Promise((r) => setTimeout(r, 120));
		t('and says it has been kept',
			host.querySelector('[data-act="hold-scan"]')?.disabled === true);

		// A second view, sharing SOME defects with the first and not others,
		// so the tally has something to distribute rather than a clean split.
		await ed.open(new Uint8Array(await (await fetch('/__defects.dng?mode=scattered&n=60&shared=12&seed=77')).arrayBuffer()),
			'second-view.dng');
		await new Promise((r) => setTimeout(r, 250));
		await scan();
		t('a second capture is counted against the first',
			/Across 2 captures/i.test(host.textContent),
			host.textContent.match(/Across \d+ captures[^.]*\./)?.[0] || '(no tally)');
		t('with the threshold offered as N of M',
			!!host.querySelector('[data-act="need-2"]'));
		t('and nothing offering a threshold of one, which would be a union',
			!host.querySelector('[data-act="need-1"]'));
		const mark = host.querySelector('[data-act="mark-common"]');
		t('and offers to mark what met it', !!mark);

		// Three captures, so "2 of 3" exists and differs from "3 of 3" -- the
		// whole point of the rule.
		host.querySelector('[data-act="hold-scan"]').click();
		await new Promise((r) => setTimeout(r, 120));
		await ed.open(new Uint8Array(await (await fetch('/__defects.dng?mode=scattered&n=60&shared=12&seed=99')).arrayBuffer()),
			'third-view.dng');
		await new Promise((r) => setTimeout(r, 250));
		await scan();
		t('a third capture widens the choice', !!host.querySelector('[data-act="need-3"]'),
			host.textContent.match(/Across \d+ captures/)?.[0] || '(no tally)');
		const two = host.querySelector('[data-act="need-2"]');
		const three = host.querySelector('[data-act="need-3"]');
		three.click();
		await new Promise((r) => setTimeout(r, 150));
		const strict = Number(host.querySelector('[data-act="mark-common"]')?.textContent.match(/\d+/)?.[0]);
		two.click();
		await new Promise((r) => setTimeout(r, 150));
		const loose = Number(host.querySelector('[data-act="mark-common"]')?.textContent.match(/\d+/)?.[0]);
		t('asking for fewer captures admits at least as many sites',
			Number.isFinite(strict) && Number.isFinite(loose) && loose >= strict,
			`3 of 3 gives ${strict}, 2 of 3 gives ${loose}`);

		// Marking from the tally must say so, rather than leaving the reader
		// to think the number came from the frame on screen.
		host.querySelector('[data-act="mark-common"]').click();
		await new Promise((r) => setTimeout(r, 200));
		t('marking from the tally says which rule produced it',
			/turned up in at least 2 of 3 captures/i.test(host.textContent),
			host.textContent.match(/\d+ sites? turned up[^.]*\./)?.[0] || '(said nothing)');
		// The planted twelve are what three captures have in common; the rest
		// differ by seed. Recovering about that many is the rule working.
		// No \b: the "Defects" heading runs straight into the number in
		// textContent, so there is no word boundary in front of it. This is
		// the second time that has caught a check in this file.
		t('and recovers close to the defects every capture really shared',
			/(?:^|\D)(1[0-4]) sites? turned up/.test(host.textContent),
			host.textContent.match(/\d+ sites? turned up[^.]*\./)?.[0] || '(none)');

		const forget = [...host.querySelectorAll('.re-btn')].find((b) => /^Forget/.test(b.textContent));
		t('and the kept scans can be discarded', !!forget, forget?.textContent);

		/*
		 * The two ways this measurement goes wrong need opposite remedies, and
		 * the panel has to work out which one applies rather than leaving the
		 * operator to guess. Both regimes are reproduced here.
		 *
		 * Scattered survivors across captures: the reading stands.
		 * Clustered survivors that repeat forever: scene detail, and no number
		 * of further captures of the same view will shift it -- so the panel
		 * must say to move the camera, not to keep scanning.
		 */
		forget.click();
		await new Promise((r) => setTimeout(r, 150));
		for (const [i, seed] of [11, 22, 33].entries()) {
			await ed.open(new Uint8Array(await (await fetch('/__textured.dng?n=160')).arrayBuffer()),
				'textured-' + i + '.dng');
			await new Promise((r) => setTimeout(r, 250));
			await scan();
			const k = host.querySelector('[data-act="hold-scan"]');
			if (k && !k.disabled) { k.click(); await new Promise((r) => setTimeout(r, 120)); }
		}
		await new Promise((r) => setTimeout(r, 200));
		t('survivors that keep coming back but are clumped say to move the camera',
			/move the camera|point it at something plain/i.test(host.textContent),
			[...host.querySelectorAll('.re-notice')].map((n) => n.textContent.trim().slice(0, 60)).join(' | ') || '(nothing)');
		t('and are NOT reported as a sensor reading',
			!/what sensor defects look like/i.test(host.textContent));
	}
	ed.destroy();
	host.remove();
} catch (e) {
	t('the defect scan reports its own trustworthiness', false, e.message);
}

/* Finding the chart rather than dragging it on.
 *
 * The engine's own tests prove the detector; this one proves the button --
 * the worker round trip, and that what comes back reaches the four grips the
 * operator can still drag. The frame is drawn to order by the check's server
 * at corners chosen here, so the right answer is known exactly. */
try {
	const host = document.createElement('div');
	document.body.append(host);
	const ed = mountEditor(host, { base: '../dist/', styles: false });
	const TRUTH = [[150, 60], [540, 120], [470, 420], [100, 330]];
	const url = '/__chart.dng?corners=' + encodeURIComponent(JSON.stringify(TRUTH));
	await ed.open(new Uint8Array(await (await fetch(url)).arrayBuffer()), 'chart.dng');

	// The default corners, taken before Calibrate is opened, so the automatic
	// look below has something to have moved them FROM.
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Calibrate').click();
	const find = host.querySelector('[data-act="find-chart"]');
	t('Calibrate offers to look for the chart', !!find);
	// Synchronously after the switch: the look is already under way, which is
	// what says it was not waiting to be asked.
	t('and starts looking without being asked', find.disabled && find.textContent === 'Looking…',
		`button reads "${find.textContent}", ${find.disabled ? 'disabled' : 'enabled'}`);
	const before = [...host.querySelectorAll('.re-chart-grip')].map((g) => g.style.left);

	for (let i = 0; i < 100 && find.disabled; i++) await new Promise((r) => setTimeout(r, 100));
	const after = [...host.querySelectorAll('.re-chart-grip')].map((g) => g.style.left);
	t('and moves the corners off their default on its own', before.join() !== after.join(),
		`${before.join(' ')} -> ${after.join(' ')}`);
	t('and it is usable again afterwards', !find.disabled && find.textContent === 'Look again');

	// Pressing it again must still work -- it is the way back from a near miss
	// the operator has since dragged about.
	{
		const grip = host.querySelector('.re-chart-grip[data-corner="0"]');
		// Inside the canvas: a point in the letterbox margin is out of frame,
		// where frameCoords rightly refuses it and nothing moves.
		const cvr = host.querySelector('.re-stage canvas').getBoundingClientRect();
		const moved = { clientX: cvr.left + cvr.width * 0.3, clientY: cvr.top + cvr.height * 0.3 };
		const r0 = grip.getBoundingClientRect();
		grip.dispatchEvent(new PointerEvent('pointerdown',
			{ bubbles: true, pointerId: 41, clientX: r0.left + 9, clientY: r0.top + 9 }));
		window.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 41, ...moved }));
		window.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 41, ...moved }));
		const dragged = grip.style.left;
		find.click();
		for (let i = 0; i < 100 && find.disabled; i++) await new Promise((r) => setTimeout(r, 100));
		t('pressing it again puts a dragged corner back on the chart',
			grip.style.left !== dragged, `${dragged} -> ${grip.style.left}`);
	}

	// Leaving and coming back must NOT search again: by then the corners may
	// be where a person put them.
	{
		const placed = [...host.querySelectorAll('.re-chart-grip')].map((g) => g.style.left);
		[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Develop').click();
		await new Promise((r) => setTimeout(r, 200));
		[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Calibrate').click();
		const again = host.querySelector('[data-act="find-chart"]');
		t('coming back to Calibrate does not search over corners already placed',
			!!again && !again.disabled, again ? `button reads "${again.textContent}"` : '(no button)');
		await new Promise((r) => setTimeout(r, 300));
		t('and leaves them where they were',
			[...host.querySelectorAll('.re-chart-grip')].map((g) => g.style.left).join() === placed.join());
	}

	/*
	 * Where they landed.
	 *
	 * Compared as a SHAPE rather than in frame pixels. The editor puts the
	 * grips through a fit transform -- letterboxing inside the canvas, a
	 * scale, and a preview step -- and inverting all that here would be
	 * reimplementing the editor in its own test, badly; the first attempt did,
	 * and reported 26 px of error that was entirely its own arithmetic. That
	 * transform is a translation and a uniform scale, so normalising each quad
	 * about its centroid cancels it exactly, and what is left is the question
	 * actually worth asking: is this the chart's quad, with its corners in the
	 * right order?
	 */
	const norm = (q) => {
		const cx = q.reduce((a, p) => a + p[0], 0) / 4, cy = q.reduce((a, p) => a + p[1], 0) / 4;
		const r = Math.hypot(...q.map((p) => Math.hypot(p[0] - cx, p[1] - cy))) / 2;
		return q.map((p) => [(p[0] - cx) / r, (p[1] - cy) / r]);
	};
	const got = norm([...host.querySelectorAll('.re-chart-grip')]
		.map((g) => [parseFloat(g.style.left), parseFloat(g.style.top)]));
	const want = norm(TRUTH);
	let worst = 0;
	for (let i = 0; i < 4; i++)
		worst = Math.max(worst, Math.hypot(got[i][0] - want[i][0], got[i][1] - want[i][1]));
	// In units of the quad's own radius: 0.04 is a few pixels on a chart this
	// size, and getting a corner wrong -- the failure this is here for -- is
	// worth more than one whole unit.
	t('the corners land on the chart, in the right order', worst < 0.04,
		`worst corner off by ${worst.toFixed(3)} of the chart's radius`);

	// They must still be draggable: found corners are an offer, not a verdict.
	{
		const grip = host.querySelector('.re-chart-grip[data-corner="0"]');
		const was = grip.style.left, r = grip.getBoundingClientRect();
		grip.dispatchEvent(new PointerEvent('pointerdown',
			{ bubbles: true, pointerId: 31, clientX: r.left + 9, clientY: r.top + 9 }));
		const cr = host.querySelector('.re-stage canvas').getBoundingClientRect();
		const to = { clientX: cr.left + cr.width * 0.4, clientY: cr.top + cr.height * 0.4 };
		window.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 31, ...to }));
		window.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 31, ...to }));
		t('a found corner can still be dragged', grip.style.left !== was,
			`${was} -> ${grip.style.left}`);
	}

	// And on a frame with no chart in it, it has to say so rather than leave
	// a lattice fitted to the furniture sitting there looking placed.
	await ed.open(new Uint8Array(await (await fetch('./fixture.dng')).arrayBuffer()), 'fixture.dng');
	const find2 = host.querySelector('[data-act="find-chart"]');
	const plain = [...host.querySelectorAll('.re-chart-grip')].map((g) => g.style.left);
	for (let i = 0; i < 100 && find2.disabled; i++) await new Promise((r) => setTimeout(r, 100));
	await new Promise((r) => setTimeout(r, 200));
	t('a frame with no chart is told so, without being asked',
		/no chart found/i.test(host.textContent),
		host.querySelector('.re-notice')?.textContent.slice(0, 80) || '(said nothing)');
	// The fallback IS the manual path, so the message has to send them to it.
	t('and is sent to place the corners by hand', /by hand/i.test(host.textContent),
		host.querySelector('.re-notice')?.textContent.slice(0, 80) || '(said nothing)');
	t('and its corners are left at the default, ready to drag',
		[...host.querySelectorAll('.re-chart-grip')].map((g) => g.style.left).join() === plain.join());
	t('with the button still there to try again', !!find2 && !find2.disabled);
	host.remove();
} catch (e) {
	t('finding the chart works end to end', false, e.message);
}

/* Diagnose: the third mode, and the demosaic choice that came with it. */
try {
	const host = document.createElement('div');
	document.body.append(host);
	const ed = mountEditor(host, { base: '../dist/', styles: false });
	await ed.open(new Uint8Array(await (await fetch('./fixture.dng')).arrayBuffer()), 'fixture.dng');

	const opts = [...host.querySelectorAll('.re-panel .re-seg button')].map((b) => b.textContent);
	t('the demosaic choice includes every method the engine has',
		opts.includes('None') && opts.includes('Bilinear') && opts.includes('Gradient') &&
		opts.includes('RCD'), JSON.stringify(opts));

	// The one a frame opens on, which is the one most people will ever see.
	t('RCD is what a frame opens on', (() => {
		const seg = [...host.querySelectorAll('.re-panel .re-seg')]
			.find((n) => n.textContent.includes('Bilinear'));
		return seg?.querySelector('button.on')?.textContent === 'RCD';
	})());

	// RCD develops through a cached full-frame green plane rather than one
	// filter per pixel, so it is the one that can fail to draw anything.
	[...host.querySelectorAll('.re-panel .re-seg button')].find((b) => b.textContent === 'RCD').click();
	for (let i = 0; i < 80 && !host.querySelector('.re-stage canvas:not([hidden])'); i++)
		await new Promise((r) => setTimeout(r, 100));
	await new Promise((r) => setTimeout(r, 600));
	t('and RCD actually develops a picture', (() => {
		const c = host.querySelector('.re-stage canvas');
		if (!c || c.hidden) return false;
		const px = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
		let lit = 0;
		for (let i = 0; i < px.length; i += 4) if (px[i] || px[i + 1] || px[i + 2]) lit++;
		return lit > px.length / 8;      // not a black frame
	})());

	const diagBtn = [...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Diagnose');
	t('Diagnose is a mode now, not a stub', !!diagBtn && !diagBtn.disabled);
	diagBtn.click();
	await new Promise((r) => setTimeout(r, 300));
	t('and it offers to scan rather than scanning unasked',
		!!host.querySelector('[data-act="scan"]') && !host.querySelector('.re-mark'));

	host.querySelector('[data-act="scan"]').click();
	for (let i = 0; i < 100 && !/Black level/.test(host.querySelector('.re-insp').textContent); i++)
		await new Promise((r) => setTimeout(r, 100));
	const text = host.querySelector('.re-insp').textContent;
	t('the scan reports every heading it promises',
		/Defects/.test(text) && /Black level/.test(text) && /Clipping/.test(text) && /Noise/.test(text),
		text.replace(/\s+/g, ' ').slice(0, 200));
	t('and the black level it read is the one in the file',
		new RegExp('file\\s*' + 50).test(text.replace(/\s+/g, ' ')) || /50/.test(text));

	t('the defects it found are marked on the picture',
		host.querySelectorAll('.re-mark').length > 0 ||
		/None\./.test(host.querySelector('.re-insp').textContent));

	// Moving the render's white point must NOT throw the scan away, because it
	// is not one of the scan's inputs: saturation is the sensor's and is in the
	// file. The finding this covers was that lowering White made real hot
	// pixels disappear from the report.
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Develop').click();
	await new Promise((r) => setTimeout(r, 200));
	{
		// The label is uppercased by CSS, not in the DOM, so match what is
		// actually there.
		const white = [...host.querySelectorAll('.re-row')]
			.find((r) => r.querySelector('.re-rname')?.textContent === 'White');
		t('the White control is where the test expects it', !!white);
		const input = white.querySelector('input');
		input.value = String(Math.max(+input.min, +input.value - 200));
		input.dispatchEvent(new Event('change', { bubbles: true }));
		await new Promise((r) => setTimeout(r, 500));
		[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Diagnose').click();
		await new Promise((r) => setTimeout(r, 300));
		t('moving the render white point keeps the scan, which is not about it',
			/Black level/.test(host.querySelector('.re-insp').textContent));
	}

	// A scan describes one frame under one set of inputs. Change the Bayer
	// pattern and the old defect coordinates describe nothing.
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Develop').click();
	await new Promise((r) => setTimeout(r, 200));
	[...host.querySelectorAll('.re-panel .re-seg button')].find((b) => b.textContent === 'BGGR').click();
	await new Promise((r) => setTimeout(r, 400));
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Diagnose').click();
	await new Promise((r) => setTimeout(r, 300));
	t('changing the Bayer pattern throws the old scan away',
		!/Black level/.test(host.querySelector('.re-insp').textContent) &&
		host.querySelectorAll('.re-mark').length === 0,
		host.querySelector('.re-insp').textContent.replace(/\s+/g, ' ').slice(0, 70));

	// Switching away must take the marks with it.
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Develop').click();
	await new Promise((r) => setTimeout(r, 200));
	t('leaving Diagnose hides its marks', host.querySelector('.re-marks').hidden);
	ed.destroy();
	host.remove();
} catch (e) {
	t('diagnose works end to end', false, e.message);
}

/* Confirming is only real once the host has been told. A keep() that fails
 * must not be reported as kept: the operator would stop watching a change the
 * host is still armed to undo. */
try {
	const host = document.createElement('div');
	document.body.append(host);
	const seen = [];
	const ed = mountEditor(host, {
		base: '../dist/', styles: false,
		calibrate: {
			holdSeconds: 600,
			apply: async () => { seen.push('apply'); },
			revert: async () => { seen.push('revert'); },
			keep: async () => { seen.push('keep'); throw new Error('the camera answered 500.'); },
		},
	});
	await ed.open(new Uint8Array(await (await fetch('./fixture.dng')).arrayBuffer()), 'fixture.dng');
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Calibrate').click();
	await new Promise((r) => setTimeout(r, 300));
	host.querySelector('[data-act="measure"]').click();
	for (let i = 0; i < 100 && !host.querySelector('[data-act="apply-to-camera"]'); i++)
		await new Promise((r) => setTimeout(r, 100));
	host.querySelector('[data-act="apply-to-camera"]').click();
	for (let i = 0; i < 40 && !host.querySelector('[data-act="keep"]'); i++)
		await new Promise((r) => setTimeout(r, 100));
	host.querySelector('[data-act="keep"]').click();
	await new Promise((r) => setTimeout(r, 600));
	const said = host.querySelector('[data-act="hold"]').textContent;
	t('a confirmation that did not reach the camera is not reported as kept',
		!/^Kept\./.test(said.trim()) && /did not reach/.test(said), said.slice(0, 90));
	t('and it can be tried again', !!host.querySelector('[data-act="keep"]'));
	ed.destroy();
	host.remove();
} catch (e) {
	t('a failed confirmation is handled', false, e.message);
}

/* A module that never arrives must fail fast and say so, not leave the caller
 * waiting for ever on a worker that will never answer. */
try {
	const broken = mountEditor(document.createElement('div'),
		{ base: '../no-such-directory/', styles: false });
	const began = performance.now();
	let message = '';
	try { await broken.open(new Uint8Array(8), 'x.dng'); }
	catch (e) { message = e.message; }
	const took = performance.now() - began;
	t('a missing module fails rather than hangs', /http 404/.test(message), message || '(resolved!)');
	t('and fails promptly', took < 10000, Math.round(took) + ' ms');
	broken.destroy();

	/* And a stylesheet that will not load must not hold the interface hostage.
	 * Hiding it until the CSS lands is right; hiding it FOREVER because the
	 * CSS 404'd would turn a cosmetic failure into a blank page. Here the
	 * module is already imported, so a bad base breaks only the fetches --
	 * the stylesheet among them. */
	const noCss = document.createElement('div');
	document.body.append(noCss);
	const ed = mountEditor(noCss, { base: '../no-such-directory/' });
	t('a page whose stylesheet 404s starts hidden all the same',
		noCss.style.visibility === 'hidden');
	for (let i = 0; i < 100 && noCss.style.visibility === 'hidden'; i++)
		await new Promise((r) => setTimeout(r, 50));
	t('but is revealed anyway rather than staying blank for ever',
		noCss.style.visibility !== 'hidden', `visibility ${noCss.style.visibility || '(unset)'}`);
	t('and the splash does not sit on top of it',
		!noCss.querySelector('[data-act="splash"]'));
	ed.destroy();
	noCss.remove();
} catch (e) {
	t('the missing-module path is handled', false, e.message);
}

/* The burst goes two ways, and choosing the wrong one is SILENT.
 *
 * Mean is averaged by the camera in one request; Reject cannot be, because an
 * outlier cannot be found in an average that has already been taken. Both
 * produce a stacked picture that looks right either way -- the only visible
 * difference between "the camera averaged sixteen" and "we asked sixteen
 * times over thirteen seconds" is the wall clock, which no assertion sees.
 * So what is checked here is the REQUESTS, not the picture.
 */
try {
	const host = document.createElement('div');
	document.body.append(host);
	const fixture = new Uint8Array(await (await fetch('./fixture.dng')).arrayBuffer());
	const calls = [];
	// What the camera would send back. `inCamera` is the module's verdict on
	// whether `X-Frames-Averaged` actually came back, not what was asked for.
	let serve = (o) => (o.separate
		? { frames: Array.from({ length: o.frames }, () => fixture.slice()),
			rect: { left: 60, top: 60, width: 120, height: 60 }, asked: o.rect }
		: { frames: [fixture.slice()], averaged: o.frames, inCamera: true,
			rect: { left: 60, top: 60, width: 120, height: 60 }, asked: o.rect });

	const cand = { text: 'M759XP177', minConf: 0.82, score: 0.71, perChar: [],
		box: { left: 100, top: 110, width: 40, height: 12 } };
	// The stub records a fingerprint of the picture it was handed, so a test can
	// tell whether the reader got the develop that is on screen or a stale one.
	const seen = [];
	const fingerprint = (cv) => {
		try {
			const g = cv.getContext('2d', { willReadFrequently: true });
			const d = g.getImageData(0, 0, Math.min(16, cv.width), Math.min(16, cv.height)).data;
			let h = 0;
			for (let i = 0; i < d.length; i += 4) h = (h + d[i] * 31 + d[i + 1] * 7 + d[i + 2]) % 100000;
			return cv.width + 'x' + cv.height + ':' + h;
		} catch (e) { return 'unreadable'; }
	};
	const plates = {
		readerSupported: true,
		reader: async () => ({
			floor: 0.5,
			readAll: async (full) => { seen.push(fingerprint(full)); return [cand]; },
			read: async () => ({ text: 'M759XP177', minConf: 0.9, perChar: [] }),
		}),
		burst: async (o) => { calls.push({ frames: o.frames, separate: !!o.separate }); return serve(o); },
	};

	// Nothing here may hang the page: the harness has one budget for every
	// check on it, and a promise that never settles costs all of them.
	const guard = (p, what, ms) => Promise.race([p, new Promise((_, rj) =>
		setTimeout(() => rj(new Error('timed out waiting for ' + what)), ms || 8000))]);
	const until = async (what, fn, ms) => {
		const end = Date.now() + (ms || 8000);
		for (;;) {
			const v = fn();
			if (v) return v;
			if (Date.now() > end) throw new Error('timed out waiting for ' + what);
			await new Promise((r) => setTimeout(r, 60));
		}
	};

	const ed = mountEditor(host, { base: '../dist/', styles: false, plates });
	await guard(ed.open(fixture.slice(), 'fixture.dng'), 'the fixture to open', 15000);
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Plates').click();
	const find = await until('the Plates tab',
		() => host.querySelector('[data-act="find-plates"]'));
	find.click();
	const row = await until('a plate in the list',
		() => host.querySelector('[data-act="plate-row"]'), 15000);
	t('a detected plate is listed and can be picked', !!row);
	row.click();

	/* The reader reads what Develop produced, and two of the four demosaics
	 * cost it real accuracy -- none reads almost nothing, bilinear gives up
	 * about ten points. Silence there is a crippled read that looks like a
	 * hard subject. */
	const warned = () => {
		const w = host.querySelector('[data-act="demosaic-warning"]');
		return w ? w.textContent : '';
	};
	t('the default demosaic draws no warning', warned() === '', warned());

	ed.setDemosaic ? ed.setDemosaic(1) : null;
	// No public setter, so drive it the way a user does: the Develop control.
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Develop').click();
	await until('the demosaic control', () => [...host.querySelectorAll('.re-seg button')]
		.some((b) => b.textContent === 'Bilinear'));
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Bilinear').click();
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Plates').click();
	await until('the plates panel again', () => host.querySelector('[data-act="find-plates"]'));
	t('bilinear is called out, with what it costs',
		/Bilinear/.test(warned()) && /ten points/.test(warned()), warned().slice(0, 120));

	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Develop').click();
	await until('the demosaic control', () => [...host.querySelectorAll('.re-seg button')]
		.some((b) => b.textContent === 'None'));
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'None').click();
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Plates').click();
	await until('the plates panel again', () => host.querySelector('[data-act="find-plates"]'));
	t('and no demosaic at all is called out more strongly',
		/almost nothing/.test(warned()), warned().slice(0, 120));

	// Back to RCD so the rest of this block measures what it meant to.
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Develop').click();
	await until('the demosaic control', () => [...host.querySelectorAll('.re-seg button')]
		.some((b) => b.textContent === 'RCD'));
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'RCD').click();
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Plates').click();
	await until('the plates panel again', () => host.querySelector('[data-act="find-plates"]'));
	host.querySelector('[data-act="find-plates"]').click();
	await until('the plate list again', () => host.querySelector('[data-act="plate-row"]'), 15000);
	host.querySelector('[data-act="plate-row"]').click();

	/* The develop handed to the reader is cached, and it used to be validated on
	 * width alone while being invalidated from the renderer -- which clears it
	 * only after its own develop returns. Switching demosaic and pressing Find
	 * inside that window read the PREVIOUS picture, under a warning describing
	 * the new one. The fingerprints have to differ. */
	const pickDemosaic = async (label) => {
		[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Develop').click();
		await until('the demosaic control', () => [...host.querySelectorAll('.re-seg button')]
			.some((b) => b.textContent === label));
		[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === label).click();
		[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Plates').click();
		await until('the plates panel', () => host.querySelector('[data-act="find-plates"]'));
		host.querySelector('[data-act="find-plates"]').click();
		await until('a read', () => seen.length > 0, 15000);
		return seen.pop();
	};
	seen.length = 0;
	const fpNone = await pickDemosaic('None');
	const fpRcd  = await pickDemosaic('RCD');
	t('the reader is handed the develop that is actually selected, not a cached one',
		fpNone !== fpRcd && fpNone !== 'unreadable', fpNone + ' vs ' + fpRcd);

	host.querySelector('[data-act="find-plates"]').click();
	await until('the plate list again', () => host.querySelector('[data-act="plate-row"]'), 15000);
	host.querySelector('[data-act="plate-row"]').click();

	const go = await until('the burst card',
		() => host.querySelector('[data-act="stack-burst"]'));
	t('picking one offers a burst', !!go);
	const count = go.parentElement.querySelector('input[type="number"]');
	t('and the frame count stops where the camera does',
		count.max === '16', 'max=' + count.max);
	count.value = '4';

	/* Only the comparison the burst produced, never the card's own prose: the
	 * explanation above the button contains the phrase "averaged by the camera"
	 * whatever happens, so a page-wide match would pass without a burst having
	 * run at all. */
	const caption = () => (host.querySelector('[data-act="burst-compare"]')
		.textContent || '').replace(/\s+/g, ' ');

	// The button is re-enabled whichever way the burst ends, so waiting on it
	// reports a failed burst as a failed assertion rather than as a timeout.
	const settled = (b) => until('the burst to finish', () => !b.disabled, 12000);
	const said = () => (host.querySelector('[data-act="stack-burst"]')
		.parentElement.parentElement.textContent || '').replace(/\s+/g, ' ').slice(0, 200);

	go.click();
	await settled(go);
	t('Mean asks the camera to average, in ONE request',
		calls.some((c) => c.frames === 4 && !c.separate), JSON.stringify(calls) + ' — ' + said());
	t('and fetches a single plain frame to compare it against',
		calls.some((c) => c.frames === 1 && c.separate), JSON.stringify(calls));
	t('which is two requests and no more', calls.length === 2, JSON.stringify(calls));
	t('and it says the camera did the averaging',
		/averaged by the camera/.test(caption()), caption().slice(0, 160));

	/* The control frame is captured AFTER the average, because the camera's
	 * burst arrives already taken and has no constituent frame to hand back.
	 * So the two pictures are two moments, and a car that moved between them
	 * lands in the difference. Calling that "stacking moved the read" would
	 * credit the arithmetic with the traffic. */
	const status = () => (host.querySelector('[data-act="burst-status"]')
		.textContent || '').replace(/\s+/g, ' ');
	t('the camera path does not claim stacking caused the difference',
		!/Stacking moved/.test(status()), status().slice(0, 170));
	t('it says the two pictures are separate captures',
		/two separate captures/.test(status()), status().slice(0, 170));

	// Reject: the individual frames, or there is nothing to reject.
	calls.length = 0;
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Reject').click();
	const goR = host.querySelector('[data-act="stack-burst"]');
	goR.click();
	await settled(goR);
	t('Reject asks for the frames themselves',
		calls.length === 1 && calls[0].separate && calls[0].frames === 4,
		JSON.stringify(calls) + ' — ' + said());
	t('and does not ask for a comparison frame on top of them',
		!calls.some((c) => c.frames === 1), JSON.stringify(calls));
	t('and says the rejection happened here', /outliers rejected/.test(caption()),
		caption().slice(0, 160));
	// Here the control IS the burst's own first frame, so the causal wording
	// is the correct one and has to survive.
	t('and here the difference IS the stacking, and says so',
		/Stacking moved/.test(status()), status().slice(0, 170));

	/* An old camera ignores `?frames=` and sends one frame. The module falls
	 * back to asking one at a time -- but the mode is still Mean, and calling
	 * that "outliers rejected" would be a lie about what the picture went
	 * through. */
	calls.length = 0;
	serve = (o) => ({ frames: Array.from({ length: o.frames }, () => fixture.slice()),
		rect: { left: 60, top: 60, width: 120, height: 60 }, asked: o.rect });
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent === 'Mean').click();
	const goF = host.querySelector('[data-act="stack-burst"]');
	goF.click();
	await settled(goF);
	t('a camera too old to average is not reported as having averaged',
		!/averaged by the camera/.test(caption()), caption().slice(0, 160));
	t('nor is a plain mean labelled as a rejection',
		/frames, mean/.test(caption()) && !/outliers rejected/.test(caption()),
		caption().slice(0, 160));

	ed.destroy(); host.remove();
} catch (e) {
	t('the burst paths are exercised', false, e.message);
}

/* Closing mid-flight must settle whatever was in the air. */
try {
	const closing = mountEditor(document.createElement('div'), { base: '../dist/', styles: false });
	const inFlight = closing.open(new Uint8Array(
		await (await fetch('./fixture.dng')).arrayBuffer()), 'fixture.dng');
	closing.destroy();
	let message = '';
	try { await inFlight; } catch (e) { message = e.message; }
	t('closing the editor settles requests in flight', /closed/.test(message),
		message || '(never settled)');
} catch (e) {
	t('the teardown path is handled', false, e.message);
}
/* Focus: the tab follows the same rule as Plates and Capture, and the poll it
 * starts must die with the tab. A leaked interval is the failure that hides
 * best -- nothing on screen changes, and a camera answers a page nobody is
 * looking at until the browser is closed. */
try {
	const tabNames = (el) => [...el.querySelectorAll('.re-seg button')].map((b) => b.textContent.trim());
	const bare = document.createElement('div');
	document.body.append(bare);
	mountEditor(bare, { base: '../dist/', styles: false, autoCapture: false });
	t('no Focus tab without a focus provider', !tabNames(bare).includes('Focus'),
		tabNames(bare).join('|'));

	let calls = 0;
	const GRID = { rows: 2, cols: 3 };
	const host = document.createElement('div');
	document.body.append(host);
	const ed = mountEditor(host, {
		base: '../dist/', styles: false, autoCapture: false,
		focus: {
			intervalMs: 20,
			zones: () => {
				calls++;
				// one blown zone, one dark, the rest ordinary
				return Promise.resolve({ ...GRID, zones: [
					[0, 900, 0, 100, 1000, 40],
					[0, 100, 0, 10, 1000, 0],
					[0, 300, 0, 30, 1000, 0],
					[0, 50, 0, 5, 1, 0],
					[0, 700, 0, 70, 1000, 0],
					[0, 200, 0, 20, 1000, 0],
				] });
			},
		},
	});
	t('a focus provider grows a Focus tab', tabNames(host).includes('Focus'),
		tabNames(host).join('|'));

	const tab = [...host.querySelectorAll('.re-seg button')].find((b) => b.textContent.trim() === 'Focus');
	tab.click();
	await new Promise((r) => setTimeout(r, 120));
	const insp = host.querySelector('.re-insp');
	const status = insp.querySelector('[data-act="focus-status"]');
	t('entering Focus polls the camera', calls > 0, `${calls} call(s)`);
	t('and says where the sharpest zone is', !!status && /Sharpest at row \d+, column \d+/.test(status.textContent),
		status ? status.textContent : '(no status)');
	// The blown zone has the largest response of all six. A display that
	// followed the raw maximum would send the operator to a reflection.
	t('the peak is not the blown zone', !!status && /row 2, column 2/.test(status.textContent),
		status ? status.textContent : '');
	t('and it counts what it could not measure', !!status &&
		/1 too dark/.test(status.textContent) && /1 blown out/.test(status.textContent),
		status ? status.textContent : '');
	t('4 of 6 zones measured', !!status && /4 of 6 zones measured/.test(status.textContent),
		status ? status.textContent : '');

	// Leaving the tab must stop the poll.
	const before = calls;
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent.trim() === 'Develop').click();
	await new Promise((r) => setTimeout(r, 120));
	t('leaving Focus stops the poll', calls === before, `${before} -> ${calls}`);

	// And so must closing the editor, from inside the tab.
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent.trim() === 'Focus').click();
	await new Promise((r) => setTimeout(r, 60));
	const beforeDestroy = calls;
	ed.destroy();
	await new Promise((r) => setTimeout(r, 120));
	t('and destroying the editor stops it too', calls === beforeDestroy,
		`${beforeDestroy} -> ${calls}`);
} catch (e) {
	t('the Focus tab is handled', false, e.message);
}

/* The heatmap itself, over a real frame. The zone maths is unit-tested without
 * a browser; what can only be checked here is that a grid of the shape the
 * camera reported is laid over the picture, and that the three zone states
 * stay visually distinct once drawn. */
try {
	const host = document.createElement('div');
	document.body.append(host);
	const ed = mountEditor(host, {
		base: '../dist/', styles: false, autoCapture: false,
		focus: {
			intervalMs: 20,
			zones: () => Promise.resolve({ rows: 2, cols: 3, zones: [
				[0, 900, 0, 100, 1000, 40],
				[0, 100, 0, 10, 1000, 0],
				[0, 300, 0, 30, 1000, 0],
				[0, 50, 0, 5, 1, 0],
				[0, 700, 0, 70, 1000, 0],
				[0, 200, 0, 20, 1000, 0],
			] }),
		},
	});
	const bytes = new Uint8Array(await (await fetch('./fixture.dng')).arrayBuffer());
	await ed.open(bytes, 'fixture.dng');
	await new Promise((r) => setTimeout(r, 300));
	[...host.querySelectorAll('.re-seg button')].find((b) => b.textContent.trim() === 'Focus').click();
	await new Promise((r) => setTimeout(r, 150));

	const cells = host.querySelectorAll('.re-fz, .re-fz-none');
	t('a cell is drawn for every zone the camera reported', cells.length === 6,
		`${cells.length} cell(s)`);
	t('the two it could not measure are drawn unfilled',
		host.querySelectorAll('.re-fz-none').length === 2,
		`${host.querySelectorAll('.re-fz-none').length} unfilled`);
	t('and the sharpest is marked', host.querySelectorAll('.re-fz-peak').length === 1);
	// Brightness has to carry the measurement, or every zone reads the same.
	const fills = [...host.querySelectorAll('.re-fz')].map((r) => +r.getAttribute('fill-opacity'));
	t('brighter where the picture is sharper', Math.max(...fills) > Math.min(...fills),
		fills.map((v) => v.toFixed(2)).join(' '));
	// The grid has to cover the frame, not a corner of it.
	const box = host.querySelector('.re-chart-svg').getBoundingClientRect();
	const spread = [...cells].reduce((a, r) => {
		const b = r.getBoundingClientRect();
		return { l: Math.min(a.l, b.left), r: Math.max(a.r, b.right) };
	}, { l: Infinity, r: -Infinity });
	t('and it spans the frame rather than a corner',
		spread.r - spread.l > box.width * 0.5,
		`${(spread.r - spread.l).toFixed(0)}px of ${box.width.toFixed(0)}px`);
	ed.destroy();
} catch (e) {
	t('the focus heatmap is handled', false, e.message);
}

// Reported over HTTP rather than through the title: the harness then runs on
// a real clock. A virtual-time budget fires every timer as fast as it can,
// which loses the race against the module's own fetches every time.
await fetch('/__results', { method: 'POST', body: JSON.stringify(results) });
document.title = 'done';
</script>
